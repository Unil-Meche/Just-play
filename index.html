<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean - English - Nepali Vocabulary Flashcards</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --active-green: #10b981;
  }

  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 20px;
  }

  /* Control Panel */
  .controls-bar {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: sticky;
    top: 10px;
    z-index: 100;
  }

  .control-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .control-label {
    font-weight: 700;
    min-width: 110px;
    font-size: 0.95rem;
  }

  button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }

  button:hover {
    background: #f9fafb;
  }

  button.toggle-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  button.audio-toggle.active {
    background: var(--active-green);
    color: white;
    border-color: var(--active-green);
  }

  button.play-btn {
    background: #ef4444;
    color: white;
    border: none;
    font-size: 1rem;
    padding: 10px 20px;
  }

  button.play-btn.playing {
    background: #f59e0b;
  }

  button.action-btn {
    background: var(--primary);
    color: white;
    border: none;
  }

  button.action-btn:hover {
    background: var(--primary-hover);
  }

  /* Input Sections */
  .input-section {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .single-inputs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }

  textarea {
    height: 110px;
    resize: vertical;
  }

  .hint {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* Vocabulary List */
  .vocab-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 15px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    border: 2px solid transparent;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .card.speaking {
    border-color: var(--active-green);
    transform: scale(1.02);
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
  }

  .card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    background: #eee;
  }

  .word-item {
    margin: 6px 0;
    padding: 6px 8px;
    border-radius: 6px;
    background: #f9fafb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .word-korean {
    font-size: 1.3rem;
    font-weight: 700;
    color: #111827;
  }

  .word-english {
    font-size: 1rem;
    color: #374151;
    font-weight: 500;
  }

  .word-nepali {
    font-size: 1.1rem;
    color: var(--primary);
    font-weight: 600;
  }

  .hidden {
    display: none !important;
  }

  .card-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .mini-btn {
    padding: 4px 10px;
    font-size: 0.8rem;
  }

  .delete-btn {
    color: #ef4444;
    border-color: #fecaca;
  }

  .voice-warning {
    font-size: 0.8rem;
    color: #b45309;
    background: #fef3c7;
    padding: 6px 12px;
    border-radius: 6px;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🇰🇷 🇺🇸 🇳🇵 Vocabulary Studio</h1>

  <!-- TOP CONTROLS -->
  <div class="controls-bar">
    <!-- Autoplay & Audio Language Selection -->
    <div class="control-group">
      <span class="control-label">🔊 Audio Languages:</span>
      <button id="audio-ko" class="audio-toggle active" onclick="toggleAudioLang('ko')">Korean</button>
      <button id="audio-en" class="audio-toggle" onclick="toggleAudioLang('en')">English</button>
      <button id="audio-ne" class="audio-toggle active" onclick="toggleAudioLang('ne')">Nepali</button>
      <button id="autoplay-btn" class="play-btn" onclick="toggleAutoplay()">▶ Start Autoplay</button>
    </div>

    <!-- View / Visibility Selection -->
    <div class="control-group">
      <span class="control-label">👁️ Show Text:</span>
      <button id="view-ko" class="toggle-btn active" onclick="toggleViewLang('ko')">Korean</button>
      <button id="view-en" class="toggle-btn active" onclick="toggleViewLang('en')">English</button>
      <button id="view-ne" class="toggle-btn active" onclick="toggleViewLang('ne')">Nepali</button>
    </div>

    <div id="voice-warning" class="voice-warning">
      ⚠️ Note: Your browser/device does not have a Nepali Text-to-Speech voice installed. Hindi/default voice will be used as fallback for Nepali text.
    </div>
  </div>

  <!-- ADD VOCABULARY SECTION -->
  <div class="input-section">
    <div class="tabs">
      <button class="toggle-btn active" onclick="switchTab('single', this)">➕ Add Single Word</button>
      <button class="toggle-btn" onclick="switchTab('bulk', this)">📋 Bulk Import (Comma Separated)</button>
      <button class="mini-btn delete-btn" style="margin-left:auto;" onclick="clearAllWords()">🗑️ Clear All</button>
    </div>

    <!-- Single Word Tab -->
    <div id="tab-single" class="tab-content active">
      <div class="single-inputs">
        <input type="text" id="in-ko" placeholder="Korean (e.g. 사과)">
        <input type="text" id="in-en" placeholder="English (e.g. Apple)">
        <input type="text" id="in-ne" placeholder="Nepali (e.g. स्याउ)">
        <input type="text" id="in-img" placeholder="Image URL (Optional)">
      </div>
      <button class="action-btn" onclick="addSingleWord()">Add Word</button>
    </div>

    <!-- Bulk Import Tab -->
    <div id="tab-bulk" class="tab-content">
      <div class="hint">
        Format: <b>Korean, English, Nepali, ImageURL (optional)</b> — one word per line.
      </div>
      <textarea id="bulk-text" placeholder="사과, Apple, स्याउ, https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400
물, Water, पानी
학교, School, विद्यालय
감사합니다, Thank you, धन्यवाद"></textarea>
      <div style="margin-top: 10px;">
        <button class="action-btn" onclick="importBulk()">Import Bulk Words</button>
      </div>
    </div>
  </div>

  <!-- VOCABULARY CARDS -->
  <div id="vocab-list" class="vocab-list"></div>
</div>

<script>
  // Default Starter Vocabulary
  let vocabList = JSON.parse(localStorage.getItem('vocabData')) || [
    { ko: "사과", en: "Apple", ne: "स्याउ", img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" },
    { ko: "물", en: "Water", ne: "पानी", img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400" },
    { ko: "책", en: "Book", ne: "किताब", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400" },
    { ko: "감사합니다", en: "Thank you", ne: "धन्यवाद", img: "" }
  ];

  // Active States
  let audioState = { ko: true, en: false, ne: true };
  let viewState = { ko: true, en: true, ne: true };
  let isAutoplaying = false;
  let currentIndex = 0;
  let availableVoices = [];

  // Load Voices
  function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
    const hasNepali = availableVoices.some(v => v.lang.toLowerCase().includes('ne'));
    if (availableVoices.length > 0 && !hasNepali) {
      document.getElementById('voice-warning').style.display = 'block';
    }
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  // Save & Render
  function saveData() {
    localStorage.setItem('vocabData', JSON.stringify(vocabList));
  }

  function renderCards() {
    const container = document.getElementById('vocab-list');
    container.innerHTML = '';

    vocabList.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${index}`;

      let imgHtml = item.img ? `<img src="${item.img}" alt="${item.en}" onerror="this.style.display='none'">` : '';

      card.innerHTML = `
        <div>
          ${imgHtml}
          <div class="word-item ${viewState.ko ? '' : 'hidden'}">
            <span class="word-korean">${item.ko}</span>
            <button class="mini-btn" onclick="speakSingleText('${escapeQuotes(item.ko)}', 'ko')">🔊</button>
          </div>
          <div class="word-item ${viewState.en ? '' : 'hidden'}">
            <span class="word-english">${item.en}</span>
            <button class="mini-btn" onclick="speakSingleText('${escapeQuotes(item.en)}', 'en')">🔊</button>
          </div>
          <div class="word-item ${viewState.ne ? '' : 'hidden'}">
            <span class="word-nepali">${item.ne}</span>
            <button class="mini-btn" onclick="speakSingleText('${escapeQuotes(item.ne)}', 'ne')">🔊</button>
          </div>
        </div>
        <div class="card-actions">
          <button class="mini-btn" onclick="playSingleCard(${index})">▶ Play Card</button>
          <button class="mini-btn delete-btn" onclick="deleteWord(${index})">Delete</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function escapeQuotes(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  // Toggle Audio Languages
  function toggleAudioLang(lang) {
    audioState[lang] = !audioState[lang];
    document.getElementById(`audio-${lang}`).classList.toggle('active', audioState[lang]);
  }

  // Toggle View Languages
  function toggleViewLang(lang) {
    viewState[lang] = !viewState[lang];
    document.getElementById(`view-${lang}`).classList.toggle('active', viewState[lang]);
    renderCards();
  }

  // Tabs
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tabs .toggle-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    btn.classList.add('active');
  }

  // Add Single Word
  function addSingleWord() {
    const ko = document.getElementById('in-ko').value.trim();
    const en = document.getElementById('in-en').value.trim();
    const ne = document.getElementById('in-ne').value.trim();
    const img = document.getElementById('in-img').value.trim();

    if (!ko && !en && !ne) {
      alert("Please enter at least one word.");
      return;
    }

    vocabList.push({ ko, en, ne, img });
    saveData();
    renderCards();

    document.getElementById('in-ko').value = '';
    document.getElementById('in-en').value = '';
    document.getElementById('in-ne').value = '';
    document.getElementById('in-img').value = '';
  }

  // Import Bulk Words
  function importBulk() {
    const raw = document.getElementById('bulk-text').value.trim();
    if (!raw) return;

    const lines = raw.split('\n');
    let addedCount = 0;

    lines.forEach(line => {
      if (!line.trim()) return;
      const parts = line.split(',').map(p => p.trim());
      const ko = parts[0] || '';
      const en = parts[1] || '';
      const ne = parts[2] || '';
      // Rejoin remaining parts in case URL has commas
      const img = parts.slice(3).join(',') || '';

      if (ko || en || ne) {
        vocabList.push({ ko, en, ne, img });
        addedCount++;
      }
    });

    saveData();
    renderCards();
    document.getElementById('bulk-text').value = '';
    alert(`Imported ${addedCount} words!`);
  }

  function deleteWord(index) {
    stopAutoplay();
    vocabList.splice(index, 1);
    saveData();
    renderCards();
  }

  function clearAllWords() {
    if (confirm("Delete all vocabulary words?")) {
      stopAutoplay();
      vocabList = [];
      saveData();
      renderCards();
    }
  }

  // Speech Synthesis Helper
  function getBestVoice(lang) {
    if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
    if (lang === 'ko') {
      return availableVoices.find(v => v.lang.includes('ko')) || null;
    }
    if (lang === 'en') {
      return availableVoices.find(v => v.lang.includes('en-US')) || availableVoices.find(v => v.lang.includes('en')) || null;
    }
    if (lang === 'ne') {
      // Try Nepali first, fallback to Hindi (Devanagari script) so it reads Nepali script properly
      return availableVoices.find(v => v.lang.toLowerCase().includes('ne')) ||
             availableVoices.find(v => v.lang.toLowerCase().includes('hi')) || null;
    }
    return null;
  }

  function speakPromise(text, lang) {
    return new Promise((resolve) => {
      if (!text) {
        resolve();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice(lang);
      if (voice) utterance.voice = voice;

      if (lang === 'ko') utterance.lang = 'ko-KR';
      if (lang === 'en') utterance.lang = 'en-US';
      if (lang === 'ne') utterance.lang = voice ? voice.lang : 'ne-NP';

      utterance.rate = 0.95;
      utterance.onend = () => setTimeout(resolve, 350); // Pause between words
      utterance.onerror = () => resolve();

      window.speechSynthesis.speak(utterance);
    });
  }

  function speakSingleText(text, lang) {
    stopAutoplay();
    window.speechSynthesis.cancel();
    speakPromise(text, lang);
  }

  // Play a single card using selected audio toggles
  async function playSingleCard(index) {
    stopAutoplay();
    highlightCard(index);
    await speakCardLanguages(vocabList[index]);
    clearHighlights();
  }

  // Speak enabled languages for a word object
  async function speakCardLanguages(item) {
    if (!item) return;
    if (audioState.ko && item.ko) await speakPromise(item.ko, 'ko');
    if (audioState.en && item.en) await speakPromise(item.en, 'en');
    if (audioState.ne && item.ne) await speakPromise(item.ne, 'ne');
  }

  // Autoplay Logic
  function toggleAutoplay() {
    if (isAutoplaying) {
      stopAutoplay();
    } else {
      startAutoplay();
    }
  }

  function startAutoplay() {
    if (vocabList.length === 0) return;
    if (!audioState.ko && !audioState.en && !audioState.ne) {
      alert("Please turn ON at least one Audio Language (Korean, English, or Nepali) first!");
      return;
    }

    isAutoplaying = true;
    const btn = document.getElementById('autoplay-btn');
    btn.textContent = '⏹ Stop Autoplay';
    btn.classList.add('playing');

    currentIndex = 0;
    runAutoplayLoop();
  }

  function stopAutoplay() {
    isAutoplaying = false;
    window.speechSynthesis.cancel();
    const btn = document.getElementById('autoplay-btn');
    btn.textContent = '▶ Start Autoplay';
    btn.classList.remove('playing');
    clearHighlights();
  }

  async function runAutoplayLoop() {
    while (isAutoplaying && currentIndex < vocabList.length) {
      highlightCard(currentIndex);
      await speakCardLanguages(vocabList[currentIndex]);
      if (!isAutoplaying) break;
      currentIndex++;
      await new Promise(r => setTimeout(r, 500)); // Pause before next card
    }
    if (isAutoplaying) {
      stopAutoplay(); // Finished list
    }
  }

  function highlightCard(index) {
    clearHighlights();
    const card = document.getElementById(`card-${index}`);
    if (card) {
      card.classList.add('speaking');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function clearHighlights() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('speaking'));
  }

  // Initial Render
  renderCards();
</script>

</body>
</html>
