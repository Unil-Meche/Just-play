
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Vibes ☁️</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#171411;color:#f5eadd;
 font-family:'DM Sans',sans-serif;
 padding-bottom:110px;
}
header{
 display:flex;justify-content:space-between;align-items:center;
 padding:24px 7%;border-bottom:1px solid #ffffff15;
}
.logo{font:26px 'Playfair Display';color:#e8c49e}
nav a{color:#c9b9a7;text-decoration:none;margin-left:20px;font-size:13px}
.hero{
 padding:90px 8%;
 background:linear-gradient(90deg,#171411 10%,#171411b0),
 url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=1400') center/cover;
}
.hero small{letter-spacing:5px;color:#d4aa80}
.hero h1{font:clamp(45px,7vw,76px) 'Playfair Display';margin:20px 0}
.hero p{color:#c6b7a6;line-height:1.8;max-width:430px}
button{cursor:pointer}
.hero button{
 margin-top:25px;padding:14px 28px;border:0;border-radius:30px;
 background:#d4aa80;color:#211810;font-weight:bold;
}
section{padding:40px 7%}
h2{font:30px 'Playfair Display';margin-bottom:22px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.filters button{
 background:#302820;color:#d8c5b1;border:1px solid #554333;
 padding:10px 16px;border-radius:25px;
}
.filters button.active,.filters button:hover{background:#d4aa80;color:#211810}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
 gap:20px;
}
.card{
 background:#25201b;padding:12px;border-radius:15px;
 cursor:pointer;transition:.25s;min-width:0;
}
.card:hover{transform:translateY(-5px);background:#382c21}
.card img{
 width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
}
.card h3{font-size:15px;margin-top:12px}
.card p{font-size:12px;color:#b4a18d;margin-top:5px}
.card .tag{font-size:10px;color:#d4aa80;margin-top:9px}
.player{
 position:fixed;bottom:0;left:0;width:100%;
 background:#211c18f5;backdrop-filter:blur(15px);
 border-top:1px solid #ffffff20;
 padding:13px 5%;display:flex;align-items:center;gap:16px;z-index:5;
}
.player img{width:52px;height:52px;object-fit:cover;border-radius:9px}
.current{flex:1;min-width:80px}
.current strong{font-size:14px}
.current p{font-size:12px;color:#b4a18d;margin-top:4px}
.controls{display:flex;align-items:center;gap:12px}
.controls button{background:none;color:white;border:0;font-size:21px}
.controls .main{
 background:#d4aa80;color:#211810;border-radius:50%;
 width:42px;height:42px;
}
.timeline{display:flex;align-items:center;gap:8px;max-width:230px;flex:1}
input{accent-color:#d4aa80;min-width:0}
.timeline input{width:100%}
.volume{width:75px}
footer{text-align:center;color:#a99988;padding:45px 10px}
@media(max-width:600px){
 header{padding:18px 5%}
 .logo{font-size:21px}
 nav a{margin-left:9px;font-size:11px}
 .hero{padding:65px 7%}
 section{padding:30px 5%}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .player{gap:9px;padding:10px}
 .timeline,.volume{display:none}
 .controls{gap:8px}
}
</style>
</head>

<body>
<header>
 <div class="logo">☁ Cozy Vibes</div>
 <nav>
  <a href="#home">Home</a>
  <a href="#music">Music</a>
 </nav>
</header>

<div class="hero" id="home">
 <small>YOUR LITTLE ESCAPE</small>
 <h1>Slow down.<br>Feel everything.</h1>
 <p>Twenty songs, twenty moods, and a little peaceful corner just for you.</p>
 <button onclick="playSong(0)">♫ Start listening</button>
</div>

<section id="music">
 <h2>Your music universe 🎧</h2>
 <div class="filters" id="filters">
  <button class="active" onclick="filterSongs('All',this)">All songs</button>
  <button onclick="filterSongs('Lo-fi',this)">🌧 Lo-fi</button>
  <button onclick="filterSongs('Love',this)">💗 Love</button>
  <button onclick="filterSongs('K-pop',this)">🎀 K-pop</button>
  <button onclick="filterSongs('Indie',this)">🌿 Indie</button>
  <button onclick="filterSongs('Sad',this)">🥀 Sad</button>
  <button onclick="filterSongs('Jazz',this)">☕ Jazz</button>
 </div>
 <div class="grid" id="songGrid"></div>
</section>

<footer>Made with ♡ for your cozy little world.</footer>

<div class="player">
 <img id="cover" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=200">
 <div class="current">
  <strong id="songName">Choose a song</strong>
  <p id="artist">Cozy Vibes ☁</p>
 </div>
 <div class="controls">
  <button onclick="previousSong()">⏮</button>
  <button class="main" id="playBtn" onclick="togglePlay()">▶</button>
  <button onclick="nextSong()">⏭</button>
 </div>
 <div class="timeline">
  <span id="elapsed">0:00</span>
  <input id="seek" type="range" min="0" max="100" value="0">
  <span id="duration">0:00</span>
 </div>
 <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".7">
</div>

<audio id="audio"></audio>

<script>
const songs = [
{name:"Rainy Window",artist:"Lo-fi Dreams",mood:"Lo-fi",image:"photo-1519608487953-e999c86e7455"},
{name:"Midnight Rain",artist:"Sleepy Beats",mood:"Lo-fi",image:"photo-1518837695005-2083093ee35b"},
{name:"Coffee & Clouds",artist:"Cozy Beats",mood:"Lo-fi",image:"photo-1495474472287-4d71bcdd2085"},
{name:"Moonlight Study",artist:"Night Owl",mood:"Lo-fi",image:"photo-1519681393784-d120267933ba"},

{name:"Golden Love",artist:"Soft Hearts",mood:"Love",image:"photo-1516589178581-6cd7833ae3b2"},
{name:"Falling For You",artist:"Romantic Soul",mood:"Love",image:"photo-1518895949257-7621c3c786d7"},
{name:"Sweet Memories",artist:"Dreamy Heart",mood:"Love",image:"photo-1470252649378-9c29740c9fa8"},
{name:"Love Letters",artist:"Slow Romance",mood:"Love",image:"photo-1490730141103-6cac27aaab94"},

{name:"Seoul Nights",artist:"Korean Mood",mood:"K-pop",image:"photo-1538485399081-7c897a3b4f6d"},
{name:"Pink Dreams",artist:"K-pop Vibes",mood:"K-pop",image:"photo-1515886657613-9f3515b0c78f"},
{name:"Neon Seoul",artist:"City Pop",mood:"K-pop",image:"photo-1519608487953-e999c86e7455"},

{name:"Golden Hour",artist:"Indie Soul",mood:"Indie",image:"photo-1470225620780-dba8ba36b745"},
{name:"Wildflower",artist:"Dreamy Indie",mood:"Indie",image:"photo-1490750967868-88aa4486c946"},
{name:"Summer Somewhere",artist:"Indie Days",mood:"Indie",image:"photo-1470252649378-9c29740c9fa8"},

{name:"Empty Streets",artist:"Sad Soul",mood:"Sad",image:"photo-1519608487953-e999c86e7455"},
{name:"Lost Without You",artist:"Blue Heart",mood:"Sad",image:"photo-1500530855697-b586d89ba3ee"},
{name:"Goodbye Again",artist:"Lonely Nights",mood:"Sad",image:"photo-1518837695005-2083093ee35b"},

{name:"Midnight Cafe",artist:"Jazz Room",mood:"Jazz",image:"photo-1511192336575-5a79af67a629"},
{name:"Velvet Jazz",artist:"Smooth Notes",mood:"Jazz",image:"photo-1516280440614-37939bbacd81"},
{name:"Sunday Coffee",artist:"Cafe Jazz",mood:"Jazz",image:"photo-1501339847302-ac426a4a7cbb"}
];

// Demo instrumental audio sources.
// Replace these with your own licensed MP3 URLs for real genre-specific songs.
const audio = document.getElementById("audio");

songs.forEach((song,i)=>{
 song.url = `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${i+1}.mp3`;
 song.cover = `https://images.unsplash.com/${song.image}?w=500&auto=format&fit=crop&q=80`;
});

let current=0;
let visible=[...songs];

function render(){
 document.getElementById("songGrid").innerHTML=visible.map(song=>{
  let index=songs.indexOf(song);
  return `
  <div class="card" onclick="playSong(${index})">
   <img src="${song.cover}" alt="${song.name} cover">
   <h3>${song.name}</h3>
   <p>${song.artist}</p>
   <div class="tag">${song.mood} · ♫ Play</div>
  </div>`;
 }).join("");
}

function filterSongs(mood,button){
 visible=mood==="All"?[...songs]:songs.filter(s=>s.mood===mood);
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function playSong(index){
 current=index;
 let s=songs[current];
 audio.src=s.url;
 document.getElementById("songName").textContent=s.name;
 document.getElementById("artist").textContent=s.artist;
 document.getElementById("cover").src=s.cover;
 audio.play().catch(()=>alert("Could not load this demo track. Check your internet connection."));
}

function togglePlay(){
 if(!audio.src){playSong(0);return}
 if(audio.paused)audio.play();
 else audio.pause();
}

function nextSong(){playSong((current+1)%songs.length)}
function previousSong(){playSong((current-1+songs.length)%songs.length)}

function time(t){
 if(!Number.isFinite(t))return "0:00";
 return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}

audio.addEventListener("play",()=>document.getElementById("playBtn").textContent="Ⅱ");
audio.addEventListener("pause",()=>document.getElementById("playBtn").textContent="▶");
audio.addEventListener("ended",nextSong);

audio.addEventListener("loadedmetadata",()=>{
 document.getElementById("duration").textContent=time(audio.duration);
});

audio.addEventListener("timeupdate",()=>{
 if(!audio.duration)return;
 document.getElementById("seek").value=audio.currentTime/audio.duration*100;
 document.getElementById("elapsed").textContent=time(audio.currentTime);
});

document.getElementById("seek").addEventListener("input",e=>{
 if(audio.duration)audio.currentTime=e.target.value/100*audio.duration;
});

document.getElementById("volume").addEventListener("input",e=>{
 audio.volume=Number(e.target.value);
});

audio.volume=.7;
render();
</script>
</body>
</html>
