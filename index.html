<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoFlow Studio — Korean · English · Nepali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&family=Noto+Sans+KR:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-app: #f8fafc;
    --bg-surface: #ffffff;
    --bg-subtle: #f1f5f9;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-light: #e2e8f0;
    --border-focus: #6366f1;

    --accent-primary: #4f46e5;
    --accent-primary-hover: #4338ca;
    --accent-soft: #eef2ff;

    --emerald: #059669;
    --emerald-bg: #ecfdf5;
    --emerald-border: #a7f3d0;

    --rose: #e11d48;
    --rose-bg: #fff1f2;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 10px 24px -6px rgba(15, 23, 42, 0.08), 0 4px 10px -3px rgba(15, 23, 42, 0.04);
    --shadow-glow: 0 0 0 3px rgba(79, 70, 229, 0.16), 0 16px 32px -8px rgba(79, 70, 229, 0.22);

    --radius-sm: 8px;
    --radius-md: 11px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --radius-full: 9999px;

    --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 260ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-app);
    background-image:
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 84px;
  }

  /* Compact Single-Row Sticky Header */
  .navbar {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .navbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .brand-logo {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    display: grid;
    place-items: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.98rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .brand-badge {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: var(--radius-full);
    background: var(--accent-soft);
    color: var(--accent-primary);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .stat-pill {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg-subtle);
    padding: 4px 10px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-light);
    white-space: nowrap;
  }

  /* Main Container */
  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 16px 0;
  }

  /* Compact Inline Control Bar (Scrolls naturally — never blocks screen!) */
  .studio-dock {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
  }

  .dock-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }

  .dock-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .dock-label svg {
    width: 13px;
    height: 13px;
    color: var(--accent-primary);
  }

  /* Segmented Pills - Responsive & Compact */
  .pill-group {
    display: inline-flex;
    background: var(--bg-subtle);
    padding: 3px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    gap: 3px;
    max-width: 100%;
  }

  .seg-btn {
    appearance: none;
    border: none;
    background: transparent;
    padding: 5px 10px;
    border-radius: 7px;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-fast);
    user-select: none;
    white-space: nowrap;
  }

  .seg-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.7);
  }

  .seg-btn .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: all var(--transition-fast);
  }

  /* Active Audio Pill */
  .seg-btn.audio-active {
    background: var(--bg-surface);
    color: var(--emerald);
    box-shadow: var(--shadow-xs);
  }

  .seg-btn.audio-active .dot {
    background: var(--emerald);
    box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.22);
  }

  /* Active View Pill */
  .seg-btn.view-active {
    background: var(--bg-surface);
    color: var(--accent-primary);
    box-shadow: var(--shadow-xs);
  }

  .seg-btn.view-active .dot {
    background: var(--accent-primary);
    box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.22);
  }

  /* Speed & Autoplay Controls */
  .playback-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .speed-select {
    appearance: none;
    background: var(--bg-subtle);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    outline: none;
  }

  .btn-autoplay {
    appearance: none;
    border: none;
    background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
    color: white;
    padding: 7px 14px;
    border-radius: var(--radius-md);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 10px rgba(79, 70, 229, 0.25);
    transition: all var(--transition-smooth);
    white-space: nowrap;
  }

  .btn-autoplay:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(79, 70, 229, 0.35);
  }

  .btn-autoplay.is-playing {
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    box-shadow: 0 3px 12px rgba(225, 29, 72, 0.3);
  }

  /* Floating Mini Stop Pill (Only visible when scrolling while Autoplay is active) */
  .floating-player-pill {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(12px);
    color: white;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .floating-player-pill.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .floating-stop-btn {
    border: none;
    background: #e11d48;
    color: white;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* Collapsible Add / Import Drawer */
  .composer-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    margin-bottom: 18px;
    overflow: hidden;
  }

  .composer-header {
    padding: 10px 14px;
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .composer-header.has-border {
    border-bottom: 1px solid var(--border-light);
  }

  .tab-switcher {
    display: inline-flex;
    background: var(--bg-subtle);
    padding: 3px;
    border-radius: var(--radius-md);
    gap: 3px;
  }

  .tab-btn {
    border: none;
    background: transparent;
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-fast);
  }

  .tab-btn.active {
    background: var(--bg-surface);
    color: var(--text-primary);
    box-shadow: var(--shadow-xs);
  }

  .composer-tools {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-ghost {
    border: 1px solid var(--border-light);
    background: var(--bg-surface);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-fast);
  }

  .btn-ghost:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .btn-ghost.danger:hover {
    background: var(--rose-bg);
    color: var(--rose);
    border-color: #fecdd3;
  }

  .composer-body {
    padding: 14px;
  }

  .composer-body.collapsed {
    display: none;
  }

  .tab-panel {
    display: none;
    animation: fadeIn 0.2s ease;
  }

  .tab-panel.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-wrap label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .input-field, .bulk-textarea {
    width: 100%;
    background: var(--bg-app);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--text-primary);
    transition: all var(--transition-fast);
    outline: none;
  }

  .input-field:focus, .bulk-textarea:focus {
    background: var(--bg-surface);
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
  }

  .bulk-textarea {
    min-height: 96px;
    resize: vertical;
    line-height: 1.55;
  }

  .bulk-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .format-hint {
    font-size: 0.75rem;
    color: var(--text-secondary);
    background: var(--bg-subtle);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
  }

  .format-hint code {
    font-weight: 600;
    color: var(--accent-primary);
  }

  .btn-primary {
    border: none;
    background: var(--text-primary);
    color: white;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
  }

  .btn-primary:hover {
    background: #1e293b;
  }

  /* Search Toolbar */
  .grid-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
  }

  .search-box {
    position: relative;
    width: 100%;
    max-width: 320px;
  }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
  }

  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-light);
    background: var(--bg-surface);
    font-size: 0.82rem;
    outline: none;
    transition: all var(--transition-fast);
  }

  .search-box input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
  }

  /* Vocabulary Card Grid */
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .vocab-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
    position: relative;
  }

  .vocab-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #cbd5e1;
  }

  .vocab-card.is-speaking {
    border-color: var(--accent-primary);
    box-shadow: var(--shadow-glow);
    transform: translateY(-3px);
  }

  .vocab-card.is-speaking::before {
    content: "NOW PLAYING";
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: var(--accent-primary);
    color: white;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4);
  }

  .card-media {
    width: 100%;
    height: 155px;
    background: var(--bg-subtle);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border-light);
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-index-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    color: white;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--radius-full);
  }

  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .lang-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    background: var(--bg-app);
    border: 1px solid transparent;
    transition: all var(--transition-fast);
  }

  .lang-row.active-utterance {
    background: var(--emerald-bg);
    border-color: var(--emerald-border);
  }

  .lang-meta {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .lang-tag {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .text-ko {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    word-break: break-word;
  }

  .text-en {
    font-size: 0.94rem;
    font-weight: 600;
    color: var(--text-secondary);
    word-break: break-word;
  }

  .text-ne {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent-primary);
    word-break: break-word;
  }

  .speak-icon-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: var(--bg-surface);
    color: var(--text-secondary);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all var(--transition-fast);
  }

  .speak-icon-btn:hover {
    background: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
  }

  .hidden-row {
    display: none !important;
  }

  .masked-placeholder {
    padding: 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    background: var(--bg-app);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border-light);
  }

  .card-footer {
    padding: 10px 14px;
    background: var(--bg-app);
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .btn-play-card {
    border: none;
    background: var(--accent-soft);
    color: var(--accent-primary);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-fast);
  }

  .btn-play-card:hover {
    background: var(--accent-primary);
    color: white;
  }

  .btn-icon-delete {
    border: none;
    background: transparent;
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all var(--transition-fast);
  }

  .btn-icon-delete:hover {
    background: var(--rose-bg);
    color: var(--rose);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text-primary);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    font-size: 0.82rem;
    font-weight: 600;
    box-shadow: var(--shadow-md);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 999;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .empty-state {
    grid-column: 1 / -1;
    background: var(--bg-surface);
    border: 1px dashed #cbd5e1;
    border-radius: var(--radius-xl);
    padding: 48px 20px;
    text-align: center;
  }

  .voice-notice {
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    font-size: 0.76rem;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    margin-bottom: 14px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  /* Responsive Mobile & Tablet Fit (Prevents Overflow Outside Display) */
  @media (max-width: 860px) {
    .input-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .playback-cluster {
      margin-left: 0;
      width: 100%;
      justify-content: space-between;
    }
    .btn-autoplay {
      flex: 1;
      justify-content: center;
    }
  }

  @media (max-width: 540px) {
    .container {
      padding: 10px 12px 0;
    }
    .studio-dock {
      padding: 10px 12px;
      gap: 8px;
    }
    .dock-group {
      width: 100%;
      justify-content: space-between;
    }
    .pill-group {
      flex: 1;
      justify-content: space-between;
    }
    .seg-btn {
      flex: 1;
      justify-content: center;
      padding: 6px 6px;
      font-size: 0.74rem;
    }
    .input-grid {
      grid-template-columns: 1fr;
    }
    .search-box {
      max-width: 100%;
    }
  }
</style>
</head>
<body>

  <!-- COMPACT SINGLE-ROW HEADER -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <div class="brand-logo">LF</div>
        <div class="brand-text">
          <h1>LingoFlow <span class="brand-badge">PRO</span></h1>
        </div>
      </div>

      <div class="nav-actions">
        <span id="word-counter" class="stat-pill">0 Cards</span>
        <button class="btn-ghost" onclick="exportCSV()" title="Export your list">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- NON-INTRUSIVE INLINE CONTROL BAR (Never covers half the screen!) -->
    <section class="studio-dock" aria-label="Playback and View Controls">
      <!-- Audio Toggles -->
      <div class="dock-group">
        <span class="dock-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Audio
        </span>
        <div class="pill-group">
          <button id="audio-ko" class="seg-btn audio-active" onclick="toggleAudioLang('ko')">
            <span class="dot"></span> Korean
          </button>
          <button id="audio-en" class="seg-btn" onclick="toggleAudioLang('en')">
            <span class="dot"></span> English
          </button>
          <button id="audio-ne" class="seg-btn audio-active" onclick="toggleAudioLang('ne')">
            <span class="dot"></span> Nepali
          </button>
        </div>
      </div>

      <!-- Visibility Toggles -->
      <div class="dock-group">
        <span class="dock-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          View
        </span>
        <div class="pill-group">
          <button id="view-ko" class="seg-btn view-active" onclick="toggleViewLang('ko')">
            <span class="dot"></span> Korean
          </button>
          <button id="view-en" class="seg-btn view-active" onclick="toggleViewLang('en')">
            <span class="dot"></span> English
          </button>
          <button id="view-ne" class="seg-btn view-active" onclick="toggleViewLang('ne')">
            <span class="dot"></span> Nepali
          </button>
        </div>
      </div>

      <!-- Speed + Autoplay Button -->
      <div class="playback-cluster">
        <select id="speech-rate" class="speed-select" title="Pronunciation Speed">
          <option value="0.75">0.75x</option>
          <option value="0.95" selected>1.0x</option>
          <option value="1.2">1.2x</option>
        </select>

        <button id="autoplay-btn" class="btn-autoplay" onclick="toggleAutoplay()">
          <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="autoplay-label">Start Autoplay</span>
        </button>
      </div>
    </section>

    <div id="voice-notice" class="voice-notice">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Nepali system voice not detected on this device; using Devanagari fallback voice.</span>
    </div>

    <!-- COLLAPSIBLE VOCABULARY COMPOSER -->
    <section class="composer-card">
      <div id="composer-header" class="composer-header has-border">
        <div class="tab-switcher">
          <button class="tab-btn active" onclick="switchTab('single', this)">+ Add Word</button>
          <button class="tab-btn" onclick="switchTab('bulk', this)">Bulk Import</button>
        </div>

        <div class="composer-tools">
          <button id="toggle-drawer-btn" class="btn-ghost" onclick="toggleDrawer()">Hide Form</button>
          <button class="btn-ghost" onclick="restoreSampleDeck()">Sample</button>
          <button class="btn-ghost danger" onclick="clearAllWords()">Clear</button>
        </div>
      </div>

      <div id="composer-body" class="composer-body">
        <!-- Single Entry Form -->
        <div id="panel-single" class="tab-panel active">
          <div class="input-grid">
            <div class="field-wrap">
              <label for="in-ko">Korean (한국어)</label>
              <input id="in-ko" class="input-field" type="text" placeholder="e.g. 사과" onkeydown="handleEnter(event)">
            </div>
            <div class="field-wrap">
              <label for="in-en">English Meaning</label>
              <input id="in-en" class="input-field" type="text" placeholder="e.g. Apple" onkeydown="handleEnter(event)">
            </div>
            <div class="field-wrap">
              <label for="in-ne">Nepali Meaning (नेपाली)</label>
              <input id="in-ne" class="input-field" type="text" placeholder="e.g. स्याउ" onkeydown="handleEnter(event)">
            </div>
            <div class="field-wrap">
              <label for="in-img">Image URL (Optional)</label>
              <input id="in-img" class="input-field" type="url" placeholder="https://..." onkeydown="handleEnter(event)">
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end;">
            <button class="btn-primary" onclick="addSingleWord()">+ Add to Deck</button>
          </div>
        </div>

        <!-- Bulk Import Form -->
        <div id="panel-bulk" class="tab-panel">
          <textarea id="bulk-text" class="bulk-textarea" placeholder="사과, Apple, स्याउ, https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500
물, Water, पानी
책, Book, किताब, https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500
감사합니다, Thank you, धन्यवाद"></textarea>
          <div class="bulk-footer">
            <span class="format-hint">Format: <code>Korean, English, Nepali, ImageURL</code></span>
            <button class="btn-primary" onclick="importBulk()">Import Vocabulary</button>
          </div>
        </div>
      </div>
    </section>

    <!-- SEARCH BAR -->
    <div class="grid-toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search Korean, English, or Nepali..." oninput="renderCards()">
      </div>
    </div>

    <!-- VOCABULARY DECK GRID -->
    <section id="vocab-grid" class="vocab-grid"></section>

  </main>

  <!-- TINY FLOATING STOP PILL (ONLY APPEARS DURING AUTOPLAY) -->
  <div id="floating-pill" class="floating-player-pill">
    <span id="floating-status">Playing Card #1</span>
    <button class="floating-stop-btn" onclick="stopAutoplay()">Stop</button>
  </div>

  <!-- TOAST FEEDBACK -->
  <div id="toast" class="toast"></div>

<script>
  const SAMPLE_DECK = [
    { ko: "사과", en: "Apple", ne: "स्याउ", img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&q=80" },
    { ko: "물", en: "Water", ne: "पानी", img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=600&q=80" },
    { ko: "책", en: "Book", ne: "किताब", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&q=80" },
    { ko: "커피", en: "Coffee", ne: "कफी", img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=80" },
    { ko: "학교", en: "School", ne: "विद्यालय", img: "" },
    { ko: "감사합니다", en: "Thank you", ne: "धन्यवाद", img: "" }
  ];

  let vocabList = JSON.parse(localStorage.getItem('lingoflow_vocab_v2')) || [...SAMPLE_DECK];
  let audioState = { ko: true, en: false, ne: true };
  let viewState = { ko: true, en: true, ne: true };
  let isAutoplaying = false;
  let currentIndex = 0;
  let availableVoices = [];

  function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
    const hasNepali = availableVoices.some(v => v.lang.toLowerCase().includes('ne'));
    if (availableVoices.length > 0 && !hasNepali) {
      document.getElementById('voice-notice').style.display = 'flex';
    }
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function saveData() {
    localStorage.setItem('lingoflow_vocab_v2', JSON.stringify(vocabList));
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function toggleDrawer() {
    const body = document.getElementById('composer-body');
    const header = document.getElementById('composer-header');
    const btn = document.getElementById('toggle-drawer-btn');
    const isCollapsed = body.classList.toggle('collapsed');
    header.classList.toggle('has-border', !isCollapsed);
    btn.textContent = isCollapsed ? 'Show Form' : 'Hide Form';
  }

  function renderCards() {
    const grid = document.getElementById('vocab-grid');
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    document.getElementById('word-counter').textContent = `${vocabList.length} ${vocabList.length === 1 ? 'Card' : 'Cards'}`;

    const filtered = vocabList
      .map((item, originalIndex) => ({ ...item, originalIndex }))
      .filter(item =>
        !query ||
        item.ko.toLowerCase().includes(query) ||
        item.en.toLowerCase().includes(query) ||
        item.ne.toLowerCase().includes(query)
      );

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No vocabulary cards found</h3>
          <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">Add a new word above, import a comma-separated list, or clear your search filter.</p>
        </div>
      `;
      return;
    }

    const allHidden = !viewState.ko && !viewState.en && !viewState.ne;

    grid.innerHTML = filtered.map(item => {
      const idx = item.originalIndex;
      const mediaBlock = item.img
        ? `<div class="card-media">
             <img src="${escapeAttr(item.img)}" alt="${escapeAttr(item.en)}" loading="lazy" onerror="this.parentElement.style.display='none'">
             <span class="card-index-badge">#${idx + 1}</span>
           </div>`
        : '';

      return `
        <article class="vocab-card" id="card-${idx}">
          <div>
            ${mediaBlock}
            <div class="card-body">
              ${!item.img ? `<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:0.68rem;font-weight:700;color:var(--text-muted);">CARD #${idx + 1}</span></div>` : ''}

              ${allHidden ? `<div class="masked-placeholder">All text hidden for audio recall practice</div>` : ''}

              <div id="row-${idx}-ko" class="lang-row ${viewState.ko ? '' : 'hidden-row'}">
                <div class="lang-meta">
                  <span class="lang-tag">Korean</span>
                  <span class="text-ko">${escapeHtml(item.ko || '—')}</span>
                </div>
                ${item.ko ? `<button class="speak-icon-btn" title="Pronounce Korean" onclick="speakSingleText(${idx}, 'ko')">${speakerSvg()}</button>` : ''}
              </div>

              <div id="row-${idx}-en" class="lang-row ${viewState.en ? '' : 'hidden-row'}">
                <div class="lang-meta">
                  <span class="lang-tag">English</span>
                  <span class="text-en">${escapeHtml(item.en || '—')}</span>
                </div>
                ${item.en ? `<button class="speak-icon-btn" title="Pronounce English" onclick="speakSingleText(${idx}, 'en')">${speakerSvg()}</button>` : ''}
              </div>

              <div id="row-${idx}-ne" class="lang-row ${viewState.ne ? '' : 'hidden-row'}">
                <div class="lang-meta">
                  <span class="lang-tag">Nepali</span>
                  <span class="text-ne">${escapeHtml(item.ne || '—')}</span>
                </div>
                ${item.ne ? `<button class="speak-icon-btn" title="Pronounce Nepali" onclick="speakSingleText(${idx}, 'ne')">${speakerSvg()}</button>` : ''}
              </div>
            </div>
          </div>

          <div class="card-footer">
            <button class="btn-play-card" onclick="playSingleCard(${idx})">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Play Card
            </button>
            <button class="btn-icon-delete" title="Delete Card" onclick="deleteWord(${idx})">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </article>
      `;
    }).join('');
  }

  function speakerSvg() {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

  function toggleAudioLang(lang) {
    audioState[lang] = !audioState[lang];
    document.getElementById(`audio-${lang}`).classList.toggle('audio-active', audioState[lang]);
  }

  function toggleViewLang(lang) {
    viewState[lang] = !viewState[lang];
    document.getElementById(`view-${lang}`).classList.toggle('view-active', viewState[lang]);
    renderCards();
  }

  function switchTab(tab, btn) {
    const body = document.getElementById('composer-body');
    if (body.classList.contains('collapsed')) {
      toggleDrawer();
    }
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`panel-${tab}`).classList.add('active');
    btn.classList.add('active');
  }

  function handleEnter(e) {
    if (e.key === 'Enter') addSingleWord();
  }

  function addSingleWord() {
    const ko = document.getElementById('in-ko').value.trim();
    const en = document.getElementById('in-en').value.trim();
    const ne = document.getElementById('in-ne').value.trim();
    const img = document.getElementById('in-img').value.trim();

    if (!ko && !en && !ne) {
      showToast('Enter at least one word before adding.');
      return;
    }

    vocabList.unshift({ ko, en, ne, img });
    saveData();
    renderCards();

    ['in-ko', 'in-en', 'in-ne', 'in-img'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('in-ko').focus();
    showToast('Added new vocabulary card');
  }

  function importBulk() {
    const raw = document.getElementById('bulk-text').value.trim();
    if (!raw) {
      showToast('Paste comma-separated lines to import.');
      return;
    }

    const lines = raw.split('\n');
    let count = 0;

    lines.forEach(line => {
      if (!line.trim()) return;
      const parts = line.split(',').map(p => p.trim());
      const ko = parts[0] || '';
      const en = parts[1] || '';
      const ne = parts[2] || '';
      const img = parts.slice(3).join(',') || '';

      if (ko || en || ne) {
        vocabList.push({ ko, en, ne, img });
        count++;
      }
    });

    saveData();
    renderCards();
    document.getElementById('bulk-text').value = '';
    showToast(`Imported ${count} cards`);
  }

  function deleteWord(index) {
    stopAutoplay();
    vocabList.splice(index, 1);
    saveData();
    renderCards();
    showToast('Card removed');
  }

  function clearAllWords() {
    if (vocabList.length === 0) return;
    if (confirm('Remove all vocabulary cards from your workspace?')) {
      stopAutoplay();
      vocabList = [];
      saveData();
      renderCards();
      showToast('Workspace cleared');
    }
  }

  function restoreSampleDeck() {
    stopAutoplay();
    vocabList = [...SAMPLE_DECK];
    saveData();
    renderCards();
    showToast('Sample deck loaded');
  }

  function exportCSV() {
    if (!vocabList.length) {
      showToast('Nothing to export');
      return;
    }
    const csv = vocabList.map(w => [w.ko, w.en, w.ne, w.img].filter(Boolean).join(', ')).join('\n');
    const blob = new Blob([csv], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lingoflow-vocabulary.txt';
    a.click();
    showToast('Exported vocabulary list');
  }

  function getBestVoice(lang) {
    if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
    if (lang === 'ko') return availableVoices.find(v => v.lang.includes('ko')) || null;
    if (lang === 'en') return availableVoices.find(v => v.lang.includes('en-US')) || availableVoices.find(v => v.lang.includes('en')) || null;
    if (lang === 'ne') {
      return availableVoices.find(v => v.lang.toLowerCase().includes('ne')) ||
             availableVoices.find(v => v.lang.toLowerCase().includes('hi')) || null;
    }
    return null;
  }

  function speakPromise(text, lang, cardIndex = null) {
    return new Promise(resolve => {
      if (!text) return resolve();

      const rowEl = cardIndex !== null ? document.getElementById(`row-${cardIndex}-${lang}`) : null;
      if (rowEl) rowEl.classList.add('active-utterance');

      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getBestVoice(lang);
      if (voice) utterance.voice = voice;

      utterance.lang = lang === 'ko' ? 'ko-KR' : lang === 'en' ? 'en-US' : (voice ? voice.lang : 'ne-NP');
      utterance.rate = parseFloat(document.getElementById('speech-rate').value) || 0.95;

      const finish = () => {
        if (rowEl) rowEl.classList.remove('active-utterance');
        setTimeout(resolve, 280);
      };

      utterance.onend = finish;
      utterance.onerror = finish;
      window.speechSynthesis.speak(utterance);
    });
  }

  function speakSingleText(index, lang) {
    stopAutoplay();
    window.speechSynthesis.cancel();
    const item = vocabList[index];
    if (item && item[lang]) {
      speakPromise(item[lang], lang, index);
    }
  }

  async function playSingleCard(index) {
    if (!audioState.ko && !audioState.en && !audioState.ne) {
      showToast('Turn on at least one Audio language above');
      return;
    }
    stopAutoplay();
    highlightCard(index, false);
    await speakCardLanguages(vocabList[index], index);
    clearHighlights();
  }

  async function speakCardLanguages(item, index) {
    if (!item) return;
    if (audioState.ko && item.ko) await speakPromise(item.ko, 'ko', index);
    if (audioState.en && item.en) await speakPromise(item.en, 'en', index);
    if (audioState.ne && item.ne) await speakPromise(item.ne, 'ne', index);
  }

  function toggleAutoplay() {
    isAutoplaying ? stopAutoplay() : startAutoplay();
  }

  function startAutoplay() {
    if (vocabList.length === 0) {
      showToast('Add some cards first');
      return;
    }
    if (!audioState.ko && !audioState.en && !audioState.ne) {
      showToast('Enable Korean, English, or Nepali audio first');
      return;
    }

    isAutoplaying = true;
    const btn = document.getElementById('autoplay-btn');
    btn.classList.add('is-playing');
    document.getElementById('autoplay-label').textContent = 'Stop Autoplay';
    document.getElementById('play-icon').innerHTML = `<rect x="6" y="6" width="12" height="12" rx="1"/>`;
    document.getElementById('floating-pill').classList.add('visible');

    currentIndex = 0;
    runAutoplayLoop();
  }

  function stopAutoplay() {
    isAutoplaying = false;
    window.speechSynthesis.cancel();
    const btn = document.getElementById('autoplay-btn');
    btn.classList.remove('is-playing');
    document.getElementById('autoplay-label').textContent = 'Start Autoplay';
    document.getElementById('play-icon').innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
    document.getElementById('floating-pill').classList.remove('visible');
    clearHighlights();
  }

  async function runAutoplayLoop() {
    while (isAutoplaying && currentIndex < vocabList.length) {
      document.getElementById('floating-status').textContent = `Playing Card #${currentIndex + 1} of ${vocabList.length}`;
      highlightCard(currentIndex, true);
      await speakCardLanguages(vocabList[currentIndex], currentIndex);
      if (!isAutoplaying) break;
      currentIndex++;
      await new Promise(r => setTimeout(r, 420));
    }
    if (isAutoplaying) {
      stopAutoplay();
      showToast('Finished playing all cards');
    }
  }

  function highlightCard(index, shouldScroll) {
    clearHighlights();
    const card = document.getElementById(`card-${index}`);
    if (card) {
      card.classList.add('is-speaking');
      if (shouldScroll) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  function clearHighlights() {
    document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('is-speaking'));
    document.querySelectorAll('.lang-row').forEach(r => r.classList.remove('active-utterance'));
  }

  renderCards();
</script>
</body>
</html>
